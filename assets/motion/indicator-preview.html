<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenScience Thinking Indicator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f7f7f2;
      --muted: #8f918b;
      --line: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .board {
      width: min(92vw, 680px);
      display: grid;
      gap: 34px;
      padding: 40px 20px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      color: rgba(247, 247, 242, 0.84);
      font-size: 13px;
    }

    .sample {
      display: grid;
      gap: 12px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
    }

    .thinking {
      --size: 22px;
      position: relative;
      width: var(--size);
      height: var(--size);
      flex: 0 0 auto;
      animation: os-spin 3.8s linear infinite;
    }

    .thinking::before {
      content: "";
      position: absolute;
      inset: 28%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      transform-origin: center;
      animation: os-breathe 1.8s ease-in-out infinite;
    }

    .dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--size) * var(--r, 0.12));
      height: calc(var(--size) * var(--r, 0.12));
      margin-left: calc(var(--size) * var(--r, 0.12) / -2);
      margin-top: calc(var(--size) * var(--r, 0.12) / -2);
      border-radius: 999px;
      background: rgba(255, 255, 255, var(--a, 0.8));
      transform:
        rotate(var(--angle))
        translateX(calc(var(--size) * var(--distance)))
        scale(var(--scale, 1));
      animation: os-orbit 1.8s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .thinking.small {
      --size: 18px;
    }

    .thinking.large {
      --size: 32px;
    }

    .message {
      width: fit-content;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .message span {
      color: rgba(247, 247, 242, 0.7);
      font-size: 13px;
    }

    @keyframes os-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes os-breathe {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.82);
      }
      45% {
        opacity: 0.95;
        transform: scale(1.08);
      }
    }

    @keyframes os-orbit {
      0%, 100% {
        opacity: calc(var(--a, 0.8) * 0.48);
        transform:
          rotate(var(--angle))
          translateX(calc(var(--size) * (var(--distance) * 0.72)))
          scale(0.72);
      }
      44% {
        opacity: var(--a, 0.8);
        transform:
          rotate(var(--angle))
          translateX(calc(var(--size) * var(--distance)))
          scale(1);
      }
    }
  html:not([data-playing="true"]) *,html:not([data-playing="true"]) *::before{animation-play-state:paused!important}.message{border-radius:0}.board{width:min(100%,680px);padding:24px;gap:24px}
</style>
</head>
<body>
  <main class="board">
    <section class="sample">
      <div class="label">Message thinking - 22px</div>
      <div class="row">
        <div class="thinking" aria-label="Thinking">
          <i class="dot" style="--angle: 0deg; --distance: .42; --r: .12; --a: .9; --delay: 0s"></i>
          <i class="dot" style="--angle: 60deg; --distance: .38; --r: .09; --a: .64; --delay: -.22s"></i>
          <i class="dot" style="--angle: 120deg; --distance: .43; --r: .11; --a: .82; --delay: -.42s"></i>
          <i class="dot" style="--angle: 180deg; --distance: .35; --r: .08; --a: .56; --delay: -.66s"></i>
          <i class="dot" style="--angle: 240deg; --distance: .45; --r: .1; --a: .78; --delay: -.88s"></i>
          <i class="dot" style="--angle: 300deg; --distance: .36; --r: .075; --a: .52; --delay: -1.1s"></i>
        </div>
        <span>Thinking</span>
      </div>
    </section>

    <section class="sample">
      <div class="label">Inside assistant message</div>
      <div class="message">
        <div class="thinking small" aria-label="Thinking">
          <i class="dot" style="--angle: 0deg; --distance: .42; --r: .12; --a: .9; --delay: 0s"></i>
          <i class="dot" style="--angle: 72deg; --distance: .36; --r: .08; --a: .62; --delay: -.2s"></i>
          <i class="dot" style="--angle: 144deg; --distance: .44; --r: .1; --a: .78; --delay: -.4s"></i>
          <i class="dot" style="--angle: 216deg; --distance: .34; --r: .075; --a: .54; --delay: -.7s"></i>
          <i class="dot" style="--angle: 288deg; --distance: .4; --r: .095; --a: .72; --delay: -.95s"></i>
        </div>
        <span>OpenScience is thinking</span>
      </div>
    </section>

    <section class="sample">
      <div class="label">Panel / tool thinking - 32px</div>
      <div class="row">
        <div class="thinking large" aria-label="Thinking">
          <i class="dot" style="--angle: 0deg; --distance: .42; --r: .12; --a: .9; --delay: 0s"></i>
          <i class="dot" style="--angle: 45deg; --distance: .34; --r: .075; --a: .52; --delay: -.12s"></i>
          <i class="dot" style="--angle: 90deg; --distance: .45; --r: .1; --a: .78; --delay: -.32s"></i>
          <i class="dot" style="--angle: 135deg; --distance: .36; --r: .08; --a: .58; --delay: -.48s"></i>
          <i class="dot" style="--angle: 180deg; --distance: .43; --r: .11; --a: .84; --delay: -.66s"></i>
          <i class="dot" style="--angle: 225deg; --distance: .33; --r: .07; --a: .48; --delay: -.82s"></i>
          <i class="dot" style="--angle: 270deg; --distance: .4; --r: .09; --a: .7; --delay: -1s"></i>
          <i class="dot" style="--angle: 315deg; --distance: .35; --r: .075; --a: .54; --delay: -1.18s"></i>
        </div>
        <span>Analyzing context</span>
      </div>
    </section>
  </main>
<script>let requestedPlaying=false;window.setMotionPlaying=value=>{requestedPlaying=Boolean(value);document.documentElement.dataset.playing=String(requestedPlaying&&!document.hidden)};document.addEventListener('visibilitychange',()=>window.setMotionPlaying(requestedPlaying));window.parent.postMessage({type:'aipoch-motion-ready'},location.origin);</script></body>
</html>
