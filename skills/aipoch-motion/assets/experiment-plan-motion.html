const svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg',q=s=>svg.querySelector(s),qa=s=>[...svg.querySelectorAll(s)];
const clamp=v=>Math.min(1,Math.max(0,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},ramp=(t,a,b)=>smooth((t-a)/(b-a));
const spring=v=>v<=0?0:v>=1?1:1-Math.exp(-7*v)*(Math.cos(10*v)+.7*Math.sin(10*v));
const wrap=(el,id)=>{const g=document.createElementNS(NS,'g');g.id=id;el.before(g);g.append(el);return g};
const factor=wrap(q('#factor'),'factor-motion'),cell=wrap(q('#cell'),'cell-motion');
const branch=q('#groups > g > path'),branchTrace=branch.cloneNode(true);branchTrace.id='branch-trace';branchTrace.style.stroke='#c3a147';branchTrace.style.strokeWidth='1.7';branch.after(branchTrace);
const tubeParts=['control','treatment'].map(id=>{const el=q('#'+id),g=document.createElementNS(NS,'g');g.id=id+'-motion';el.prepend(g);[...el.children].filter(e=>e!==g&&e.tagName!=='text').forEach(e=>g.append(e));return {g,cap:g.querySelector('rect'),liquid:g.querySelectorAll('path')[1]}});
const dots=qa('#result-plot circle').map(el=>({el,y:+el.getAttribute('cy')}));
const means=q('#result-plot > path[stroke]');
const topLine=q('#annotation text:nth-child(2)');topLine.textContent='先提出问题，再设置对照，最后比较结果。';topLine.setAttribute('font-size','16');
const noteGroups=[];
const notes=['先明确问题：处理是否改变细胞生长？','保持其余条件一致，分成对照组与处理组。','把两组观测值放在一起，比较差异。','从问题、对照到数据，形成一份实验方案。'];
notes.forEach((s,i)=>{const e=topLine.cloneNode(true);e.textContent=s;e.style.opacity='0';e.setAttribute('aria-hidden','true');topLine.after(e);noteGroups.push(e)});topLine.remove();
const hitLayer=document.createElementNS(NS,'g');hitLayer.id='fixed-hit-areas';hitLayer.setAttribute('tabindex','-1');svg.append(hitLayer);
const hits=['question','groups','comparison'].map((id,i)=>{const e=q('#'+id+' > polygon').cloneNode(true);e.removeAttribute('id');e.setAttribute('fill','transparent');e.setAttribute('stroke','none');e.setAttribute('tabindex','0');e.setAttribute('role','button');e.setAttribute('aria-label',notes[i]);e.setAttribute('data-index',i);e.style.cursor='default';hitLayer.append(e);return e});
const D=15.6;let time=0,mode='auto',selected=-1,shown=true,hidden=document.hidden,last=performance.now(),transition=null,manualPause=false,hasEntered=false;
const media=matchMedia('(prefers-reduced-motion: reduce)');let reduced=media.matches;
const zeros=()=>({fx:0,fy:0,scale:1,split:0,lift:0,cap:0,fill:1,branch:0,dots:Array(10).fill(0),notes:[0,0,0,1]});
function pose(t){const p=zeros();const beat=ramp(t,.35,.85)*(1-ramp(t,3.35,4));p.fx=-22*beat;p.fy=8*beat;p.scale=1+.035*beat*Math.sin(Math.PI*ramp(t,.8,2.5));
 const group=ramp(t,4.2,4.65)*(1-ramp(t,7.4,8.1));p.split=7*group;p.lift=-4*group;p.cap=-8*ramp(t,4.65,5.05)*(1-ramp(t,6.4,7));p.fill=1-.32*group*(1-ramp(t,5.15,6.35));p.branch=t>=4.35&&t<=6.8?(t-4.35)/2.45:0;
 const reset=ramp(t,8.05,8.65),hold=1-ramp(t,13.8,15.2);
 p.dots=dots.map((d,i)=>{const rise=spring(clamp((t-8.75-i*.13)/.85));return (218-d.y)*reset*(1-rise)*hold});
 const stage=t<4?0:t<8.1?1:t<12.8?2:3;
 p.notes=[0,0,0,0];p.notes[stage]=1;
 // Blended captions remain anchored at a single line, no spatial motion.
 for(const [boundary,from,to] of [[3.8,0,1],[7.9,1,2],[12.6,2,3],[15.2,3,0]])if(t>=boundary&&t<boundary+.4){const a=ramp(t,boundary,boundary+.4);p.notes=[0,0,0,0];p.notes[from]=1-a;p.notes[to]=a;}
 return p;
}
function inspect(i){const p=zeros();p.notes=[0,0,0,0];p.notes[i]=1;if(i===0){p.fx=-22;p.fy=8;p.scale=1.025}if(i===1){p.split=7;p.lift=-4;p.cap=-8}return p}
function mix(a,b,v){const p={};for(const k in a)p[k]=Array.isArray(a[k])?a[k].map((x,i)=>x+(b[k][i]-x)*v):a[k]+(b[k]-a[k])*v;return p}
let current=pose(0);
function render(p){const sx=205+p.fx,sy=151+p.fy,ex=163,ey=163,len=Math.hypot(ex-sx,ey-sy),ux=(ex-sx)/len,uy=(ey-sy)/len;const hx=ex-ux*7,hy=ey-uy*7;q('#factor-arrow').setAttribute('d',`M${sx} ${sy}L${ex} ${ey}M${hx-uy*4} ${hy+ux*4}L${ex} ${ey}L${hx+uy*4} ${hy-ux*4}`);factor.setAttribute('transform',`translate(${p.fx} ${p.fy})`);cell.setAttribute('transform',`translate(100 151) scale(${p.scale}) translate(-100 -151)`);
 tubeParts.forEach((v,i)=>{v.g.setAttribute('transform',`translate(${(i?1:-1)*p.split} ${p.lift})`);v.cap.setAttribute('transform',`translate(0 ${i?p.cap:p.cap*.5})`);v.liquid.setAttribute('transform',`translate(0 202) scale(1 ${p.fill}) translate(0 -202)`)});
 const x1=74-p.split,x2=216+p.split;const branchD=`M145 70V91M${x1} 91H${x2}M${x1} 91V${111+p.lift+p.cap*.5}M${x2} 91V${111+p.lift+p.cap}`;branch.setAttribute('d',branchD);branchTrace.setAttribute('d',branchD);branchTrace.style.strokeDasharray='20 250';branchTrace.style.strokeDashoffset=String(20-p.branch*220);branchTrace.style.opacity=p.branch>0&&p.branch<1?'1':'0';
 dots.forEach((d,i)=>d.el.setAttribute('cy',d.y+p.dots[i]));
 const c=p.dots.slice(0,5).reduce((a,b)=>a+b,0)/5,t=p.dots.slice(5).reduce((a,b)=>a+b,0)/5;means.setAttribute('d',`M93 ${170+c}H126M183 ${140+t}H212`);
 const strongest=Math.max(...p.notes),active=p.notes.indexOf(strongest);noteGroups.forEach((e,i)=>e.style.opacity=i===active?Math.max(0,2*strongest-1):0);svg.dataset.mode=mode;svg.dataset.step=String(selected);}
function target(i){if(i===selected&&mode==='inspect')return;selected=i;const to=reduced?{...zeros(),notes:inspect(i).notes}:inspect(i);transition={from:current,to,elapsed:0,returning:false};mode='inspect';if(reduced){current=to;transition=null;render(current)}}
function release(){if(mode!=='inspect')return;selected=-1;transition={from:current,to:reduced?zeros():pose(time),elapsed:0,returning:true};mode='return';if(reduced){mode='auto';transition=null;current=zeros();render(current)}}
hits.forEach((e,i)=>{e.addEventListener('pointerenter',()=>target(i));e.addEventListener('focus',()=>target(i));e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();target(i)}if(ev.key==='Escape'){e.blur();release()}})});
hitLayer.addEventListener('pointerleave',()=>{if(!hits.includes(document.activeElement))release()});hitLayer.addEventListener('focusout',e=>{if(!hitLayer.contains(e.relatedTarget))release()});
svg.addEventListener('pointermove',e=>{if(!hitLayer.contains(e.target)&&!hits.includes(document.activeElement))release()});
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(shown&&!hidden&&!manualPause&&!reduced){if(transition){transition.elapsed+=dt;current=mix(transition.from,transition.to,smooth(transition.elapsed/.3));if(transition.elapsed>=.3){current=transition.to;const returning=transition.returning;transition=null;if(returning)mode='auto'}}else if(mode==='auto'){time=(time+dt)%D;current=pose(time)}render(current)}requestAnimationFrame(frame)}
function visibility(isVisible){if(!isVisible){shown=false;return}if(!shown||!hasEntered){hasEntered=true;time=0;selected=-1;mode='auto';transition=null;current=reduced?zeros():pose(0);render(current)}shown=true;last=performance.now()}
new IntersectionObserver(entries=>visibility(entries[0].isIntersecting),{threshold:.15}).observe(svg);
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});media.addEventListener('change',e=>{reduced=e.matches;transition=null;if(selected>=0){mode='inspect';current=reduced?{...zeros(),notes:inspect(selected).notes}:inspect(selected)}else{mode='auto';current=reduced?zeros():pose(time)}render(current)});

// Deterministic inspection hooks for the local regression test; no UI controls.
window.__motionTest={seek(t){time=((t%D)+D)%D;transition=null;mode='auto';selected=-1;current=pose(time);render(current)},pause(v){manualPause=v},state(){return {time,mode,selected,shown,hidden,reduced,transition:!!transition,pose:JSON.parse(JSON.stringify(current))}},visibility,pose,inspect};
render(current);requestAnimationFrame(frame);
